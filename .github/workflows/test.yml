name: Test
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun test
